services:
  toxin-backend:
    build:
      context: ./toxin-backend
    container_name: toxin-backend
    depends_on:
      - toxin-postgres
    networks:
      - toxin-network
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_HOST: toxin-postgres
      SPRING_REDIS_HOST: toxin-redis

  toxin-frontend:
    build:
      context: ./toxin-frontend
    container_name: toxin-frontend
    depends_on:
      - toxin-backend
    networks:
      - toxin-network
    ports:
      - "4200:80"

  toxin-postgres:
    image: postgres:17
    container_name: toxin-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    networks:
      - toxin-network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  toxin-redis:
    image: redis:latest
    container_name: toxin-redis
    restart: always
    networks:
      - toxin-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  toxin-zookeeper:
    image: confluentinc/cp-zookeeper:7.0.1
    container_name: toxin-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - toxin-network
    ports:
      - "2181:2181"
    volumes:
      - kafka_data:/var/lib/zookeeper/data

  toxin-kafka:
    image: confluentinc/cp-kafka:7.0.1
    container_name: toxin-kafka
    depends_on:
      - toxin-zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: toxin-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_IN_SYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    networks:
      - toxin-network
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  toxin-network:
    driver: bridge
